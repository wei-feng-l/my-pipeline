<script type="text/babel">
const { useState, useEffect } = React;
const STORAGE_KEY = "pipeline-prospects-v1";

const EMPTY = {
  id:null,name:"",company:"",email:"",phone:"",
  source:"",referredBy:"",relationshipLevel:"",
  status:"Cold",workingStatus:"Student",priority:"Medium",
  needs:[],estimatedOpportunity:"",lastContacted:"",
  nextFollowUp:"",outcome:"",notes:"",
  salary:"",expenses:"",surplus:""
};

const SOURCES=["Referral","Event","Instagram","Friend","Cold List","Client Intro"];
const REL_LEVELS=["Stranger","Acquaintance","Friend","Warm Referral"];
const STATUSES=["Cold","Warm","Hot","Client"];
const WORKING=["Student","Full-Time","Part-Time","Unemployed"];
const PRIORITIES=["Low","Medium","High"];
const NEEDS=["H&S","CI","Death/TPD","PA","Disability","Family Protection","Savings","Investment","Estate Planning/Will","Policy Review"];
const OPPORTUNITIES=["Small","Medium","Big"];
const OUTCOMES=["No Reply","Meeting Booked","Not Interested","Follow Up Later","Closed","Referred Someone","DingLian"];

const STATUS_CFG={
  Cold:{bg:"#dbeafe",color:"#1e3a8a",dot:"#3b82f6"},
  Warm:{bg:"#fef9c3",color:"#854d0e",dot:"#eab308"},
  Hot:{bg:"#fee2e2",color:"#7f1d1d",dot:"#ef4444"},
  Client:{bg:"#dcfce7",color:"#14532d",dot:"#22c55e"}
};
const WORKING_CFG={
  "Student":{bg:"#ede9fe",color:"#4c1d95"},
  "Full-Time":{bg:"#dbeafe",color:"#1e3a8a"},
  "Part-Time":{bg:"#fef9c3",color:"#854d0e"},
  "Unemployed":{bg:"#f1f5f9",color:"#475569"}
};
const PRIORITY_CFG={Low:{bg:"#f0fdf4",color:"#166534"},Medium:{bg:"#fff7ed",color:"#9a3412"},High:{bg:"#fef2f2",color:"#b91c1c"}};
const OUTCOME_CFG={
  "No Reply":{bg:"#f1f5f9",color:"#475569"},
  "Meeting Booked":{bg:"#dcfce7",color:"#14532d"},
  "Not Interested":{bg:"#fee2e2",color:"#7f1d1d"},
  "Follow Up Later":{bg:"#fef9c3",color:"#854d0e"},
  "Closed":{bg:"#dbeafe",color:"#1e3a8a"},
  "Referred Someone":{bg:"#ede9fe",color:"#4c1d95"},
  "DingLian":{bg:"#fce7f3",color:"#831843"}
};
const OPP_CFG={Small:{bg:"#f0fdf4",color:"#166534"},Medium:{bg:"#fff7ed",color:"#9a3412"},Big:{bg:"#ede9fe",color:"#4c1d95"}};

function Pill({label,cfg}){
  if(!label||!cfg) return null;
  const c=cfg[label];
  if(!c) return null;
  return React.createElement('span',{style:{background:c.bg,color:c.color,padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:600,letterSpacing:"0.04em",display:"inline-flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}},
    c.dot && React.createElement('span',{style:{width:5,height:5,borderRadius:"50%",background:c.dot,flexShrink:0}}),
    label
  );
}

function initials(n){return(n||"?").split(" ").map(w=>w[0]||"").join("").slice(0,2).toUpperCase()}
const AV_BG=["#dbeafe:#1e3a8a","#dcfce7:#14532d","#ede9fe:#4c1d95","#fee2e2:#7f1d1d","#fef9c3:#854d0e","#fce7f3:#831843"];
function avColor(n){const[bg,c]=AV_BG[(n||"A").charCodeAt(0)%AV_BG.length].split(":");return{bg,c}}
function isOverdue(d){return d&&new Date(d)<new Date(new Date().toDateString())}

// ── localStorage helpers ──────────────────────────────────────────────────────
function loadProspects(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw?JSON.parse(raw):[];
  }catch{return[]}
}
function saveProspects(data){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){console.error("Storage error",e)}
}
// ─────────────────────────────────────────────────────────────────────────────

const css=`

.pro-more-btn:hover{border-color:var(--green);color:var(--green)}
.pro-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pro-card{background:var(--card);border:0.5px solid #e2e8e3;border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.pro-card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.06)}

.pro-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}

.pro-btn-del{font-size:11.5px;padding:6px 12px;border-radius:8px;border:0.5px solid #fca5a5;background:#fff5f5;color:#b91c1c;cursor:pointer;font-weight:500;transition:all .15s;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
.pro-btn-del:hover{border-color:#ef4444;background:#fee2e2}
.pro-empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:16px}
.pro-empty-icon{font-family:'Fraunces',serif;font-size:36px;color:var(--green);font-style:italic;margin-bottom:8px}
.pro-empty-txt{font-family:'Fraunces',serif;font-size:16px;color:var(--ink2);font-style:italic}

.pro-sec-title em{font-style:italic;color:var(--ink2);font-weight:400}
.pro-sec-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.1em}
.pro-overdue-banner{background:#fef2f2;border:0.5px solid #fca5a5;border-radius:10px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#b91c1c;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:600}
.pro-modal-bg{position:fixed;inset:0;background:#000;display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:16px;overflow-y:auto}

.pro-btn-pri:hover{background:var(--green2)}

.pro-btn-dng:hover{background:#fee2e2;border-color:#ef4444}

`;

function App(){
  const[prospects,setProspects]=useState(()=>loadProspects());
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState(EMPTY);
  const[filters,setFilters]=useState({workingStatus:"",priority:"",outcome:"",search:""});
  const[tab,setTab]=useState("all");
  const[activeTab,setActiveTab]=useState("details");
  const[quickVal,setQuickVal]=useState("");

  useEffect(()=>{saveProspects(prospects);},[prospects]);

  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const toggleNeed=n=>setF("needs",form.needs.includes(n)?form.needs.filter(x=>x!==n):[...form.needs,n]);
  const openAdd=()=>{setForm({...EMPTY,id:Date.now()});setModal("form");setActiveTab("details");};
  const openEdit=p=>{setForm({...p,needs:p.needs||[]});setModal("form");setActiveTab("details");};
  const openView=p=>{setForm({...p,needs:p.needs||[]});setModal("view");};
  const save=()=>{
    setProspects(ps=>form.id&&ps.find(p=>p.id===form.id)?ps.map(p=>p.id===form.id?form:p):[...ps,{...form,id:Date.now()}]);
    setModal(null);
  };
  const del=id=>{setProspects(ps=>ps.filter(p=>p.id!==id));setModal(null);};
  const quickAdd=()=>{
    if(!quickVal.trim())return;
    const p={...EMPTY,id:Date.now(),name:quickVal.trim()};
    setProspects(ps=>[p,...ps]);
    setQuickVal("");
  };

  const now=new Date();
  const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const filtered=prospects.filter(p=>{
    const s=filters;
    return(!s.workingStatus||p.workingStatus===s.workingStatus)
      &&(!s.priority||p.priority===s.priority)
      &&(!s.outcome||p.outcome===s.outcome)
      &&(!s.search||[p.name,p.company,p.email].join(" ").toLowerCase().includes(s.search.toLowerCase()));
  });

  const byStatus={
    Cold:filtered.filter(p=>p.status==="Cold"),
    Warm:filtered.filter(p=>p.status==="Warm"),
    Hot:filtered.filter(p=>p.status==="Hot"),
    Client:filtered.filter(p=>p.status==="Client")
  };
  const tabData=tab==="cold"?byStatus.Cold:tab==="warm"?byStatus.Warm:tab==="hot"?byStatus.Hot:tab==="client"?byStatus.Client:filtered;
  const overdueList=prospects.filter(p=>isOverdue(p.nextFollowUp)&&p.workingStatus!=="Done");

  const inp=(k,placeholder,type="text")=>React.createElement('input',{className:"pro-finput",type,placeholder,value:form[k]||"",onChange:e=>setF(k,e.target.value)});
  const sel=(k,opts,placeholder)=>React.createElement('select',{className:"pro-finput pro-fselect",value:form[k]||"",onChange:e=>setF(k,e.target.value)},
    React.createElement('option',{value:""},placeholder),
    opts.map(o=>React.createElement('option',{key:o,value:o},o))
  );
  const lbl=txt=>React.createElement('label',{className:"pro-flabel"},txt);
  const g2=(a,b)=>React.createElement('div',{className:"pro-grid2"},a,b);

  return React.createElement(React.Fragment,null,
    React.createElement('style',null,css),
    React.createElement('div',{className:"pro-wrap"},

      // Header
      React.createElement('div',{className:"pro-header"},
        React.createElement('div',null,
          React.createElement('div',{className:"pro-eyebrow"},"Prospecting Tracker"),
          React.createElement('h1',{className:"pro-h1"},"My ",React.createElement('em',null,"pipeline"))
        ),
        React.createElement('div',{className:"pro-date"},
          React.createElement('strong',null,DAYS[now.getDay()].toUpperCase()),
          MONTHS[now.getMonth()]+" "+now.getDate()+", "+now.getFullYear()
        )
      ),

      React.createElement('div',{className:"pro-inner"},

        // Stats
        React.createElement('div',{className:"pro-stats"},
          [["Cold",byStatus.Cold.length],["Warm",byStatus.Warm.length],["Hot",byStatus.Hot.length],["Client",byStatus.Client.length]].map(([s,ct])=>
            React.createElement('div',{key:s,className:"pro-stat"+(tab===s.toLowerCase()?" active":""),onClick:()=>setTab(tab===s.toLowerCase()?"all":s.toLowerCase())},
              React.createElement('div',{className:"pro-stat-num",style:{color:tab===s.toLowerCase()?STATUS_CFG[s].dot:undefined}},ct),
              React.createElement('div',{className:"pro-stat-lbl"},s)
            )
          )
        ),

        // Tabs
        React.createElement('div',{className:"pro-tabs"},
          [["all","All"],["cold","Cold"],["warm","Warm"],["hot","Hot"],["client","Clients"]].map(([k,l])=>
            React.createElement('button',{key:k,className:"pro-tab"+(tab===k?" active":""),onClick:()=>setTab(k)},l)
          )
        ),
