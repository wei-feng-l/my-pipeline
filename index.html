<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Pipeline — Prospecting Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f5f0;--bg2:#efebe2;--card:#fff;--line:#e6e1d4;--line2:#d4cebd;
  --ink:#1a1a1a;--ink2:#5a625b;--ink3:#9ba29b;
  --green:#2d5a3d;--green2:#1f3d2a;--green3:#e8f0e4;
}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:40px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px}
/* Header */
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:4px}
h1{font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--ink)}
h1 em{font-style:italic;color:var(--green);font-weight:500}
.date-box{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);text-align:right;line-height:1.6}
.date-box strong{display:block;color:var(--green);font-size:12px;letter-spacing:.08em}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .18s}
.stat:hover{border-color:var(--green);transform:translateY(-1px)}
.stat.active{background:var(--green3);border-color:var(--green)}
.stat-num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1}
.stat.active .stat-num{color:var(--green)}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;margin-top:5px;font-weight:500}
/* Tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:.5px solid var(--line);border-radius:14px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:fit-content;padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:transparent;border:none;border-radius:10px;cursor:pointer;transition:all .18s;font-weight:600;white-space:nowrap}
.tab.active{background:var(--green);color:#fff}
.tab:hover:not(.active){background:var(--bg2)}
/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{flex:1 1 130px;font-size:12.5px;padding:8px 12px;border-radius:10px;border:.5px solid var(--line);background:var(--card);color:var(--ink);font-family:'JetBrains Mono',monospace;letter-spacing:.03em;cursor:pointer;-webkit-appearance:none;appearance:none}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--green)}
.btn-clear{font-size:12px;padding:8px 14px;border-radius:10px;border:.5px solid var(--line);background:none;color:var(--ink2);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
.btn-clear:hover{border-color:#c44545;color:#c44545}
/* Quick add */
.quick{display:flex;align-items:center;gap:8px;background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;margin-bottom:12px;transition:border-color .2s}
.quick:focus-within{border-color:var(--green)}
.quick input{flex:1;background:transparent;border:none;padding:8px 0;color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;min-width:0}
.quick input:focus{outline:none}
.quick input::placeholder{color:var(--ink3);font-style:italic}
.btn-qadd{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:all .18s}
.btn-qadd:hover{background:var(--green2)}
.btn-qadd:disabled{background:var(--line2);color:var(--ink3);cursor:default}
.btn-more{background:none;border:.5px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--ink2);font-size:16px;line-height:1;transition:all .15s}
.btn-more:hover{border-color:var(--green);color:var(--green)}
/* Section head */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-family:'Fraunces',serif;font-size:20px;font-weight:500;color:var(--ink)}
.sec-title em{font-style:italic;color:var(--ink2);font-weight:400}
.sec-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.1em}
/* Overdue banner */
.overdue-banner{background:#fef2f2;border:.5px solid #fca5a5;border-radius:10px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#b91c1c;letter-spacing:.05em;margin-bottom:12px;font-weight:600}
/* Cards */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:.5px solid #e2e8e3;border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card.overdue{border-color:#fca5a5}
.card.overdue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ef4444}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.card-name{font-family:'Fraunces',serif;font-size:16px;font-weight:500;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-co{font-size:12px;color:var(--ink2);margin-top:2px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.pill .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:.5px solid #f0ede8}
.fu-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink2)}
.fu-date.ov{color:#b91c1c;font-weight:600}
.card-src{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink3)}
.card-btns{display:flex;gap:5px;margin-top:10px}
.btn-edit{font-size:11.5px;padding:6px 12px;border-radius:8px;border:.5px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer;font-weight:500;transition:all .15s;font-family:'JetBrains Mono',monospace;flex:1}
.btn-edit:hover{border-color:var(--green);color:var(--green);background:var(--green3)}
.btn-del{font-size:11.5px;padding:6px 12px;border-radius:8px;border:.5px solid #fca5a5;background:#fff5f5;color:#b91c1c;cursor:pointer;font-weight:500;transition:all .15s;font-family:'JetBrains Mono',monospace}
.btn-del:hover{border-color:#ef4444;background:#fee2e2}
/* Empty */
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:16px}
.empty-icon{font-family:'Fraunces',serif;font-size:36px;color:var(--green);font-style:italic;margin-bottom:8px}
.empty-txt{font-family:'Fraunces',serif;font-size:16px;color:var(--ink2);font-style:italic}
.empty-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.08em;margin-top:6px}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:#000;z-index:200;overflow-y:auto;padding:16px;align-items:flex-start;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:22px 22px 26px;margin:auto;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.modal-title em{font-style:italic;color:var(--green)}
.modal-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:#9ba29b;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;font-weight:500}
.modal-tabs{display:flex;gap:3px;padding:3px;background:#f1f5f1;border-radius:11px;margin-bottom:14px}
.modal-tab{flex:1;padding:8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:capitalize;color:#5a625b;background:transparent;border:none;border-radius:8px;cursor:pointer;transition:all .15s;font-weight:600}
.modal-tab.active{background:var(--green);color:#fff}
.modal-tab:hover:not(.active){background:rgba(0,0,0,.05);color:#1a1a1a}
.tab-panel{display:none}.tab-panel.active{display:block}
.flbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a625b;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;margin-top:12px;display:block;font-weight:600}
.finput{width:100%;background:#f7f5f0;border:.5px solid #e6e1d4;border-radius:10px;padding:9px 12px;color:#1a1a1a;font-family:'Inter',sans-serif;font-size:13.5px;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.finput:focus{outline:none;border-color:var(--green);background:#fff}
.finput::placeholder{color:#9ba29b}
textarea.finput{resize:none;min-height:80px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sopt{padding:10px 8px;border-radius:10px;border:.5px solid #e6e1d4;background:#f7f5f0;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#5a625b;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-weight:600}
.sopt .sdot{width:7px;height:7px;border-radius:50%}
.needs-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.need-btn{padding:5px 11px;border-radius:99px;border:.5px solid #e6e1d4;background:#f7f5f0;font-size:12px;color:#5a625b;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace;font-weight:500}
.need-btn.on{background:#ede9fe;border-color:#7c3aed;color:#4c1d95}
.btn-row{display:flex;gap:8px;margin-top:18px}
.btn-pri{flex:1;padding:11px;border-radius:11px;border:none;background:var(--green);color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-pri:hover{background:var(--green2)}
.btn-sec{flex:1;padding:11px;border-radius:11px;border:.5px solid #e6e1d4;background:#f7f5f0;color:#5a625b;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-sec:hover{border-color:#1a1a1a;color:#1a1a1a}
.btn-dng{flex:1;padding:11px;border-radius:11px;border:.5px solid #fca5a5;background:#fff5f5;color:#b91c1c;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-dng:hover{background:#fee2e2}
.view-row{display:flex;gap:12px;padding:7px 0;border-bottom:.5px solid #f0ede8}
.view-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:#9ba29b;letter-spacing:.08em;text-transform:uppercase;min-width:110px;flex-shrink:0;font-weight:600;padding-top:1px}
.view-val{font-size:13px;color:#1a1a1a}
</style>
</head>
<body>
<noscript style="display:block;padding:16px;background:#fee2e2;color:#7f1d1d;font-family:Arial,sans-serif;">This app needs JavaScript to run. Please enable JavaScript in your browser.</noscript>
<div class="wrap">
  <div class="header">
    <div>
      <div class="eyebrow">Prospecting Tracker</div>
      <h1>My <em>pipeline</em></h1>
    </div>
    <div class="date-box">
      <strong id="day-lbl"></strong>
      <span id="date-lbl"></span>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="overdue-banner"></div>

  <div class="filters">
    <input id="f-search" placeholder="Search name, company…" oninput="render()">
    <select id="f-working" onchange="render()">
      <option value="">Working status</option>
      <option>Student</option><option>Full-Time</option><option>Part-Time</option><option>Unemployed</option>
    </select>
    <select id="f-priority" onchange="render()">
      <option value="">Priority</option>
      <option>Low</option><option>Medium</option><option>High</option>
    </select>
    <select id="f-outcome" onchange="render()">
      <option value="">Outcome</option>
      <option>No Reply</option><option>Meeting Booked</option><option>Not Interested</option>
      <option>Follow Up Later</option><option>Closed</option><option>Referred Someone</option><option>DingLian</option>
    </select>
    <button class="btn-clear" id="btn-clear" onclick="clearFilters()" style="display:none">Clear</button>
  </div>

  <div class="quick">
    <input id="q-inp" placeholder="Quick-add a prospect by name…" oninput="document.getElementById('q-btn').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')quickAdd()">
    <button class="btn-more" onclick="openAdd()" title="Full form">⊕</button>
    <button class="btn-qadd" id="q-btn" onclick="quickAdd()" disabled>+ Add</button>
  </div>

  <div class="sec-head">
    <div class="sec-title" id="sec-title"></div>
    <div class="sec-count" id="sec-count"></div>
  </div>
  <div id="cards"></div>
</div>

<!-- FORM MODAL -->
<div class="modal-bg" id="form-modal" onclick="if(event.target===this)closeModal('form-modal')">
  <div class="modal">
    <div class="modal-title" id="form-title">New <em>prospect</em></div>
    <div class="modal-sub">Fill in the details below</div>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchTab('details',this)">Details</button>
      <button class="modal-tab" onclick="switchTab('contact',this)">Contact</button>
      <button class="modal-tab" onclick="switchTab('follow-up',this)">Follow-Up</button>
      <button class="modal-tab" onclick="switchTab('notes',this)">Notes</button>
    </div>

    <!-- Details -->
    <div class="tab-panel active" id="panel-details">
      <div class="g2">
        <div><label class="flbl">Name</label><input class="finput" id="f-name" placeholder="Full name"></div>
        <div><label class="flbl">Company</label><input class="finput" id="f-company" placeholder="Company"></div>
      </div>
      <label class="flbl">Status</label>
      <div class="status-grid" id="status-grid"></div>
      <div class="g2">
        <div>
          <label class="flbl">Working Status</label>
          <select class="finput" id="f-working-s">
            <option>Student</option><option>Full-Time</option><option>Part-Time</option><option>Unemployed</option>
          </select>
        </div>
        <div>
          <label class="flbl">Priority</label>
          <select class="finput" id="f-priority-s">
            <option>Low</option><option>Medium</option><option>High</option>
          </select>
        </div>
      </div>
      <div class="g2">
        <div>
          <label class="flbl">Source</label>
          <select class="finput" id="f-source">
            <option value="">Select…</option>
            <option>Referral</option><option>Event</option><option>Instagram</option>
            <option>Friend</option><option>Cold List</option><option>Client Intro</option>
          </select>
        </div>
        <div><label class="flbl">Referred By</label><input class="finput" id="f-referred" placeholder="Name"></div>
      </div>
      <div class="g2">
        <div>
          <label class="flbl">Relationship</label>
          <select class="finput" id="f-rel">
            <option value="">Select…</option>
            <option>Stranger</option><option>Acquaintance</option><option>Friend</option><option>Warm Referral</option>
          </select>
        </div>
        <div>
          <label class="flbl">Opportunity</label>
          <select class="finput" id="f-opp">
            <option value="">Select…</option>
            <option>Small</option><option>Medium</option><option>Big</option>
          </select>
        </div>
      </div>
      <label class="flbl">Outcome</label>
      <select class="finput" id="f-outcome-s">
        <option value="">Select outcome…</option>
        <option>No Reply</option><option>Meeting Booked</option><option>Not Interested</option>
        <option>Follow Up Later</option><option>Closed</option><option>Referred Someone</option><option>DingLian</option>
      </select>
      <label class="flbl">Salary / Income</label>
      <input class="finput" id="f-salary" placeholder="e.g. $3,500/month">
      <div class="g2">
        <div><label class="flbl">Expenses</label><input class="finput" id="f-expenses" placeholder="e.g. $1,800/month"></div>
        <div><label class="flbl">Surplus / Saving</label><input class="finput" id="f-surplus" placeholder="e.g. $500/month"></div>
      </div>
      <label class="flbl">Needs / Interest</label>
      <div class="needs-wrap" id="needs-wrap"></div>
    </div>

    <!-- Contact -->
    <div class="tab-panel" id="panel-contact">
      <label class="flbl">Email</label><input class="finput" id="f-email" placeholder="Email address" type="email">
      <label class="flbl">Phone</label><input class="finput" id="f-phone" placeholder="Phone number" type="tel">
    </div>

    <!-- Follow-up -->
    <div class="tab-panel" id="panel-follow-up">
      <label class="flbl">Last Contacted</label><input class="finput" id="f-last" type="date">
      <label class="flbl">Next Follow-Up Date</label><input class="finput" id="f-next" type="date">
    </div>

    <!-- Notes -->
    <div class="tab-panel" id="panel-notes">
      <label class="flbl">Notes / Next Steps</label>
      <textarea class="finput" id="f-notes" rows="6" placeholder="Add notes, context, next steps…"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn-dng" id="btn-delete" onclick="deleteProspect()" style="display:none">Delete</button>
      <button class="btn-sec" onclick="closeModal('form-modal')">Cancel</button>
      <button class="btn-pri" onclick="saveProspect()">Save prospect</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-bg" id="view-modal" onclick="if(event.target===this)closeModal('view-modal')">
  <div class="modal">
    <div class="modal-title" id="view-name"></div>
    <div class="modal-sub" id="view-company"></div>
    <div id="view-pills" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>
    <div id="view-fields"></div>
    <div class="btn-row">
      <button class="btn-dng" onclick="deleteFromView()">Delete</button>
      <button class="btn-sec" onclick="closeModal('view-modal')">Close</button>
      <button class="btn-pri" onclick="editFromView()">Edit</button>
    </div>
  </div>
</div>

<script>
const KEY="pipeline-v1";
const NEEDS=["H&S","CI","Death/TPD","PA","Disability","Family Protection","Savings","Investment","Estate Planning/Will","Policy Review"];
const STATUS_CFG={Cold:{bg:"#dbeafe",color:"#1e3a8a",dot:"#3b82f6"},Warm:{bg:"#fef9c3",color:"#854d0e",dot:"#eab308"},Hot:{bg:"#fee2e2",color:"#7f1d1d",dot:"#ef4444"},Client:{bg:"#dcfce7",color:"#14532d",dot:"#22c55e"}};
const WORK_CFG={Student:{bg:"#ede9fe",color:"#4c1d95"},["Full-Time"]:{bg:"#dbeafe",color:"#1e3a8a"},["Part-Time"]:{bg:"#fef9c3",color:"#854d0e"},Unemployed:{bg:"#f1f5f9",color:"#475569"}};
const PRI_CFG={Low:{bg:"#f0fdf4",color:"#166534"},Medium:{bg:"#fff7ed",color:"#9a3412"},High:{bg:"#fef2f2",color:"#b91c1c"}};
const OUT_CFG={"No Reply":{bg:"#f1f5f9",color:"#475569"},"Meeting Booked":{bg:"#dcfce7",color:"#14532d"},"Not Interested":{bg:"#fee2e2",color:"#7f1d1d"},"Follow Up Later":{bg:"#fef9c3",color:"#854d0e"},Closed:{bg:"#dbeafe",color:"#1e3a8a"},"Referred Someone":{bg:"#ede9fe",color:"#4c1d95"},DingLian:{bg:"#fce7f3",color:"#831843"}};
const OPP_CFG={Small:{bg:"#f0fdf4",color:"#166534"},Medium:{bg:"#fff7ed",color:"#9a3412"},Big:{bg:"#ede9fe",color:"#4c1d95"}};
const AV_COLORS=["#dbeafe:#1e3a8a","#dcfce7:#14532d","#ede9fe:#4c1d95","#fee2e2:#7f1d1d","#fef9c3:#854d0e","#fce7f3:#831843"];

let prospects=[], currentTab="all", editingId=null, selectedStatus="Cold", selectedNeeds=[];

function load(){try{const r=localStorage.getItem(KEY);prospects=r?JSON.parse(r):[]}catch{prospects=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prospects))}catch(e){}}
function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2,7)}

function pill(label,cfg){
  const c=cfg[label]; if(!c) return "";
  return `<span class="pill" style="background:${c.bg};color:${c.color}">${c.dot?`<span class="dot" style="background:${c.dot}"></span>`:""}${esc(label)}</span>`;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return(n||"?").split(" ").map(w=>w[0]||"").join("").slice(0,2).toUpperCase()}
function avColor(n){const p=AV_COLORS[(n||"A").charCodeAt(0)%AV_COLORS.length].split(":");return{bg:p[0],c:p[1]}}
function isOverdue(d){return d&&new Date(d)<new Date(new Date().toDateString())}

function setDate(){
  const now=new Date();
  const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("day-lbl").textContent=DAYS[now.getDay()].toUpperCase();
  document.getElementById("date-lbl").textContent=MONTHS[now.getMonth()]+" "+now.getDate()+", "+now.getFullYear();
}

function render(){
  const search=document.getElementById("f-search").value.toLowerCase();
  const fw=document.getElementById("f-working").value;
  const fp=document.getElementById("f-priority").value;
  const fo=document.getElementById("f-outcome").value;
  const hasFilter=search||fw||fp||fo;
  document.getElementById("btn-clear").style.display=hasFilter?"":"none";

  const filtered=prospects.filter(p=>(
    (!fw||p.workingStatus===fw)&&(!fp||p.priority===fp)&&(!fo||p.outcome===fo)&&
    (!search||[p.name,p.company,p.email].join(" ").toLowerCase().includes(search))
  ));

  const bySt={Cold:filtered.filter(p=>p.status==="Cold"),Warm:filtered.filter(p=>p.status==="Warm"),Hot:filtered.filter(p=>p.status==="Hot"),Client:filtered.filter(p=>p.status==="Client")};
  const list=currentTab==="cold"?bySt.Cold:currentTab==="warm"?bySt.Warm:currentTab==="hot"?bySt.Hot:currentTab==="client"?bySt.Client:filtered;
  const overdue=prospects.filter(p=>isOverdue(p.nextFollowUp)&&p.outcome!=="Closed");

  // Stats
  document.getElementById("stats").innerHTML=["Cold","Warm","Hot","Client"].map(s=>`
    <div class="stat${currentTab===s.toLowerCase()?" active":""}" onclick="setTab('${s.toLowerCase()}')">
      <div class="stat-num" style="${currentTab===s.toLowerCase()?"color:"+STATUS_CFG[s].dot:""}">${bySt[s].length}</div>
      <div class="stat-lbl">${s}</div>
    </div>`).join("");

  // Tabs
  document.getElementById("tabs").innerHTML=[["all","All"],["cold","Cold"],["warm","Warm"],["hot","Hot"],["client","Clients"]].map(([k,l])=>
    `<button class="tab${currentTab===k?" active":""}" onclick="setTab('${k}')">${l}</button>`).join("");

  // Overdue banner
  document.getElementById("overdue-banner").innerHTML=overdue.length>0?
    `<div class="overdue-banner">⚠ ${overdue.length} overdue follow-up${overdue.length>1?"s":""} — check your pipeline</div>`:"";

  // Section title
  const titles={all:"All <em>prospects</em>",cold:"Cold <em>leads</em>",warm:"Warm <em>leads</em>",hot:"Hot <em>leads</em>",client:"<em>Clients</em>"};
  document.getElementById("sec-title").innerHTML=titles[currentTab]||"All <em>prospects</em>";
  document.getElementById("sec-count").textContent=list.length+" "+(list.length===1?"prospect":"prospects");

  // Cards
  if(list.length===0){
    document.getElementById("cards").innerHTML=`<div class="empty"><div class="empty-icon">${prospects.length===0?"∅":"✓"}</div><div class="empty-txt">${prospects.length===0?"No prospects yet":"Nothing matches your filters"}</div><div class="empty-sub">${prospects.length===0?"Type a name above to get started":"Try clearing your filters"}</div></div>`;
    return;
  }
  const MONTHS2=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("cards").innerHTML=`<div class="grid">${list.map(p=>{
    const{bg,c}=avColor(p.name);
    const ov=isOverdue(p.nextFollowUp)&&p.outcome!=="Closed";
    const needs=(p.needs||[]);
    const fuTxt=p.nextFollowUp?(()=>{const d=new Date(p.nextFollowUp);return(ov?"⚠ Overdue — ":"")+MONTHS2[d.getMonth()]+" "+d.getDate()})():"No follow-up set";
    return `<div class="card${ov?" overdue":""}" onclick="openView('${p.id}')">
      <div class="card-top">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="av" style="background:${bg};color:${c}">${initials(p.name)}</div>
          <div style="min-width:0">
            <div class="card-name">${esc(p.name)||"(No name)"}</div>
            ${p.company?`<div class="card-co">${esc(p.company)}</div>`:""}
          </div>
        </div>
        ${pill(p.status,STATUS_CFG)}
      </div>
      <div class="badges">
        ${pill(p.workingStatus,WORK_CFG)}${pill(p.priority,PRI_CFG)}
        ${p.outcome?pill(p.outcome,OUT_CFG):""}${p.estimatedOpportunity?pill(p.estimatedOpportunity,OPP_CFG):""}
      </div>
      ${needs.length>0?`<div style="font-size:11.5px;color:#5a625b;font-family:'JetBrains Mono',monospace;margin-bottom:4px">${esc(needs.slice(0,3).join(", "))}${needs.length>3?" +"+(needs.length-3):""}</div>`:""}
      <div class="card-foot">
        <div class="fu-date${ov?" ov":""}">${fuTxt}</div>
        ${p.source?`<div class="card-src">${esc(p.source)}</div>`:""}
      </div>
      <div class="card-btns" onclick="event.stopPropagation()">
        <button class="btn-edit" onclick="openEdit('${p.id}')">Edit</button>
        <button class="btn-del" onclick="if(confirm('Delete this prospect?'))deleteById('${p.id}')">Delete</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function setTab(t){
  if(currentTab===t){currentTab="all";}else{currentTab=t;}
  render();
}

function clearFilters(){
  ["f-search","f-working","f-outcome"].forEach(id=>{document.getElementById(id).value=""});
  document.getElementById("f-priority").value="";
  render();
}

function quickAdd(){
  const inp=document.getElementById("q-inp");
  const name=inp.value.trim(); if(!name)return;
  prospects.unshift({id:uid(),name,company:"",email:"",phone:"",source:"",referredBy:"",relationshipLevel:"",status:"Cold",workingStatus:"Student",priority:"Medium",needs:[],estimatedOpportunity:"",lastContacted:"",nextFollowUp:"",outcome:"",notes:"",salary:"",expenses:"",surplus:""});
  save(); inp.value=""; document.getElementById("q-btn").disabled=true; render();
}

// Status grid
function renderStatusGrid(){
  document.getElementById("status-grid").innerHTML=["Cold","Warm","Hot","Client"].map(s=>{
    const c=STATUS_CFG[s];
    const sel=selectedStatus===s;
    return `<button class="sopt${sel?" sel":""}" onclick="selectStatus('${s}')" style="${sel?`border-color:${c.dot};background:${c.bg};color:${c.color}`:""}">
      <span class="sdot" style="background:${c.dot}"></span>${s}</button>`;
  }).join("");
}
function selectStatus(s){selectedStatus=s;renderStatusGrid();}

// Needs grid
function renderNeeds(){
  document.getElementById("needs-wrap").innerHTML=NEEDS.map(n=>`
    <button class="need-btn${selectedNeeds.includes(n)?" on":""}" onclick="toggleNeed('${n}')">${esc(n)}</button>`).join("");
}
function toggleNeed(n){
  selectedNeeds=selectedNeeds.includes(n)?selectedNeeds.filter(x=>x!==n):[...selectedNeeds,n];
  renderNeeds();
}

function switchTab(name,btn){
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".modal-tab").forEach(b=>b.classList.remove("active"));
  document.getElementById("panel-"+name).classList.add("active");
  btn.classList.add("active");
}

function openAdd(){
  editingId=null; selectedStatus="Cold"; selectedNeeds=[];
  document.getElementById("form-title").innerHTML="New <em>prospect</em>";
  document.getElementById("btn-delete").style.display="none";
  ["f-name","f-company","f-email","f-phone","f-referred","f-salary","f-expenses","f-surplus","f-notes","f-last","f-next"].forEach(id=>{document.getElementById(id).value=""});
  ["f-source","f-rel","f-opp","f-outcome-s"].forEach(id=>{document.getElementById(id).value=""});
  document.getElementById("f-working-s").value="Student";
  document.getElementById("f-priority-s").value="Medium";
  renderStatusGrid(); renderNeeds();
  // reset to first tab
  switchTab("details",document.querySelector(".modal-tab"));
  document.getElementById("form-modal").classList.add("open");
}

function openEdit(id){
  const p=prospects.find(x=>x.id===id); if(!p)return;
  editingId=id; selectedStatus=p.status||"Cold"; selectedNeeds=[...(p.needs||[])];
  document.getElementById("form-title").innerHTML="Edit <em>prospect</em>";
  document.getElementById("btn-delete").style.display="";
  document.getElementById("f-name").value=p.name||"";
  document.getElementById("f-company").value=p.company||"";
  document.getElementById("f-email").value=p.email||"";
  document.getElementById("f-phone").value=p.phone||"";
  document.getElementById("f-referred").value=p.referredBy||"";
  document.getElementById("f-salary").value=p.salary||"";
  document.getElementById("f-expenses").value=p.expenses||"";
  document.getElementById("f-surplus").value=p.surplus||"";
  document.getElementById("f-notes").value=p.notes||"";
  document.getElementById("f-last").value=p.lastContacted||"";
  document.getElementById("f-next").value=p.nextFollowUp||"";
  document.getElementById("f-source").value=p.source||"";
  document.getElementById("f-rel").value=p.relationshipLevel||"";
  document.getElementById("f-opp").value=p.estimatedOpportunity||"";
  document.getElementById("f-outcome-s").value=p.outcome||"";
  document.getElementById("f-working-s").value=p.workingStatus||"Student";
  document.getElementById("f-priority-s").value=p.priority||"Medium";
  renderStatusGrid(); renderNeeds();
  switchTab("details",document.querySelector(".modal-tab"));
  document.getElementById("form-modal").classList.add("open");
}

function saveProspect(){
  const name=document.getElementById("f-name").value.trim();
  if(!name){document.getElementById("f-name").focus();return;}
  const data={
    id:editingId||uid(),name,
    company:document.getElementById("f-company").value.trim(),
    email:document.getElementById("f-email").value.trim(),
    phone:document.getElementById("f-phone").value.trim(),
    source:document.getElementById("f-source").value,
    referredBy:document.getElementById("f-referred").value.trim(),
    relationshipLevel:document.getElementById("f-rel").value,
    status:selectedStatus,
    workingStatus:document.getElementById("f-working-s").value,
    priority:document.getElementById("f-priority-s").value,
    needs:[...selectedNeeds],
    estimatedOpportunity:document.getElementById("f-opp").value,
    lastContacted:document.getElementById("f-last").value,
    nextFollowUp:document.getElementById("f-next").value,
    outcome:document.getElementById("f-outcome-s").value,
    notes:document.getElementById("f-notes").value.trim(),
    salary:document.getElementById("f-salary").value.trim(),
    expenses:document.getElementById("f-expenses").value.trim(),
    surplus:document.getElementById("f-surplus").value.trim()
  };
  if(editingId){prospects=prospects.map(p=>p.id===editingId?data:p);}
  else{prospects.unshift(data);}
  save(); closeModal("form-modal"); render();
}

function deleteProspect(){
  if(!editingId||!confirm("Delete this prospect?"))return;
  prospects=prospects.filter(p=>p.id!==editingId);
  save(); closeModal("form-modal"); render();
}

function deleteById(id){
  prospects=prospects.filter(p=>p.id!==id);
  save(); render();
}

let viewingId=null;
function openView(id){
  const p=prospects.find(x=>x.id===id); if(!p)return;
  viewingId=id;
  document.getElementById("view-name").textContent=p.name||"Prospect";
  document.getElementById("view-company").textContent=p.company||"No company";
  document.getElementById("view-pills").innerHTML=[
    pill(p.status,STATUS_CFG),pill(p.workingStatus,WORK_CFG),pill(p.priority,PRI_CFG),
    p.outcome?pill(p.outcome,OUT_CFG):"",
    p.estimatedOpportunity?pill(p.estimatedOpportunity,OPP_CFG):""
  ].join(" ");
  const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtDate=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):"";
  const rows=[
    ["Email",p.email],["Phone",p.phone],["Source",p.source],["Referred by",p.referredBy],
    ["Relationship",p.relationshipLevel],["Needs",(p.needs||[]).join(", ")],
    ["Salary",p.salary],["Expenses",p.expenses],["Surplus/Saving",p.surplus],
    ["Last contacted",fmtDate(p.lastContacted)],["Next follow-up",fmtDate(p.nextFollowUp)],["Notes",p.notes]
  ].filter(([,v])=>v);
  document.getElementById("view-fields").innerHTML=rows.map(([l,v])=>
    `<div class="view-row"><span class="view-lbl">${l}</span><span class="view-val">${esc(v)}</span></div>`).join("");
  document.getElementById("view-modal").classList.add("open");
}

function deleteFromView(){
  if(!viewingId||!confirm("Delete this prospect?"))return;
  prospects=prospects.filter(p=>p.id!==viewingId);
  save(); closeModal("view-modal"); render();
}
function editFromView(){closeModal("view-modal");openEdit(viewingId);}
function closeModal(id){document.getElementById(id).classList.remove("open");}

// Init
load(); setDate(); render();
</script>
</body>
</html>
